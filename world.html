<body>

    <div id="binary-background"></div>

    <main class="first-content">

        <a href="cipher.html" class="system-title system-link">

        </a>

        <div class="section-title world-title">

        <div class="first-text world-intro">

            <p>
                No limits, no walls, everything happens,
                nothing to stop, this is how it looks...
                <span class="world-final">
                    your <strong>world</strong>.
                </span>
            </p>

        </div>


        <div class="world-list">

            <div class="world-item" data-link="metal-gear.html">
                <span>METAL GEAR</span>
            </div>

            <div class="world-item" data-link="kingdom-hearts.html">
                <span>KINGDOM HEARTS</span>

            <div class="world-item" data-link="final-fantasy.html">
                <span>FINAL FANTASY</span>

            <div class="world-item" data-link="death-stranding.html">

            <div class="world-item" data-link="chrono-trigger.html">

<div id="world-access-denied">
    ACCESS DENIED.
</div>

    <script src="js/system.js?v=14"></script>


    <script>

        /*
         * Check access.
         */

        const accessGranted =
            sessionStorage.getItem(
                "worldAccess"
            ) === "granted";


        const worldItems =
            document.querySelectorAll(
                ".world-item"
            );


        worldItems.forEach(
            function (item) {

                item.addEventListener(
                    "click",
                    function () {

                        /*
                         * No access.
                         */

                        if (!accessGranted) {

                            return;

                        }


                        /*
                         * Access granted.
                         */

                        const link =
                            item.dataset.link;


                        if (link) {

                            window.location.href =
                                link;

                        }

                    }
                );

            }
        );

    </script>

</body>

</html>
